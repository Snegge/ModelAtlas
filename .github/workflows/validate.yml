name: Validate prototype
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet restore server/ModelAtlas.Tests --locked-mode
      - run: npm ci --prefix client
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: dotnet test server/ModelAtlas.Tests --no-restore
      - run: npm test --prefix client
      - run: npm run build --prefix client
      - run: cd client && npx playwright install --with-deps chromium
      - name: Browser flow and accessibility
        run: |
          dotnet run --project server/ModelAtlas.Api --no-build --urls http://127.0.0.1:5050 > /tmp/api.log 2>&1 &
          npm start --prefix client > /tmp/client.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4200/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e --prefix client
